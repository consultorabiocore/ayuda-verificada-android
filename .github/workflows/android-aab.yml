name: Android Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then echo "KEYSTORE_BASE64 empty"; exit 1; fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then echo "KEYSTORE_PASSWORD empty"; exit 1; fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then echo "KEY_ALIAS empty"; exit 1; fi
          echo "Secrets present"
      - name: Decode keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          printf '%s' "${{ secrets.KEYSTORE_PASSWORD }}" > android/app/storepass.txt
          printf '%s' "${{ secrets.KEYSTORE_PASSWORD }}" > android/app/keypass.txt
          ls -l android/app/release.keystore
          file android/app/release.keystore
      - name: Build unsigned release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Sign AAB with jarsigner
        run: |
          cd android
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore app/release.keystore \
            -storepass:file app/storepass.txt \
            -keypass:file app/keypass.txt \
            app/build/outputs/bundle/release/app-release.aab \
            "${{ secrets.KEY_ALIAS }}"
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab